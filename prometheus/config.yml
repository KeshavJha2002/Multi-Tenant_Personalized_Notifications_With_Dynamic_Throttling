global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus-notif-system:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node-exporter-notif-system:9100']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter-notif-system:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter-notif-system:9187']

  - job_name: 'fastapi'
    static_configs:
      - targets: ['backend-notif-system:8000']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-broker-1:9092']
